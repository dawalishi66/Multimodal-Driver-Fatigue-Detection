[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driver-state"
version = "0.1.0"
description = "Shared contracts and validation for multimodal driver-state experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]
train = [
  "torch>=2.7,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
  "tensorboard>=2.17,<3",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
