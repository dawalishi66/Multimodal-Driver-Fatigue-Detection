[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driver-state"
version = "0.1.0"
description = "Shared contracts and validation for multimodal driver-state experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]
audio = [
    "scipy>=1.10,<2",
    "scikit-learn>=1.3,<2",
    "soxr>=0.3,<2",
    "torch>=2.0",
    "torchlibrosa>=0.1,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
